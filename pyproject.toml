[project]
name = "cot6930-final-project"
version = "0.1.0"
description = "A final project for COT6930: Artificial Intelligence & Machine Learning In Production"
authors = [
    { name = "Felix Gomez", email = "felix@felixgomez.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.13.2",
    "fastapi[standard]>=0.135.1",
    "python-decouple>=3.8",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]
