[project]
name = "cot6930-final-project"
version = "0.1.0"
description = "A final project for COT6930: Artificial Intelligence & Machine Learning In Production"
authors = [
    { name = "Felix Gomez", email = "felix@felixgomez.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.75",
    "confluent-kafka>=2.13.2",
    "fastapi[standard]>=0.135.1",
    "jsonschema>=4.26.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "python-decouple>=3.8",
    "redis>=7.4.0",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandera>=0.30.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]
