name: CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch: # For manually click "Run workflow" in GitHub

jobs:
  test-and-lint:
   runs-on: ubuntu-latest

   # Add dummy variables so python-decouple doesn't crash during testing
   env:
     KAFKA_BOOTSTRAP_SERVERS: 'dummy_server:9092'
     KAFKA_CA_PEM: 'dummy_ca'
     KAFKA_SERVICE_CERT: 'dummy_cert'
     KAFKA_SERVICE_KEY: 'dummy_key'

   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Install uv
       uses: astral-sh/setup-uv@v7
       with:
         enable-cache: true

     - name: Set up Python
       uses: actions/setup-python@v6
       with:
         python-version: '3.13'

     - name: Install dependencies
       run: uv sync

     - name: Lint code with Ruff
       run: uv run ruff check .

     - name: Run tests with 70% coverage requirement
       run: uv run pytest --cov=. --cov-fail-under=70

  build-and-push:
    needs: test-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/thefelixgomez/cot6930-final-project:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
